[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-site"
version = "0.1.0"
description = "A bold, impactful portfolio website for a machine learning specialist"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "aiohttp-jinja2>=1.2.2"
]

[project.scripts]
portfolio-server = "portfolio_site.app:create_app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["portfolio_site"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
asyncio_mode = "auto"
