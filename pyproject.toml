[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-request-server"
version = "0.1.0"
description = "HTTPS server for collecting resume requests"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.9.3"
]

[project.scripts]
resume-server = "server:create_app"

[tool.hatch.build.targets.wheel]
packages = ["."]
