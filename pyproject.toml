[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-site"
version = "0.1.0"
description = "ML Specialist Portfolio Website"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.9.3",
    "aiohttp-jinja2>=1.5"
]

[project.scripts]
portfolio-server = "portfolio_site.app:create_app"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_site"]
