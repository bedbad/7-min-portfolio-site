[project]
name = "resume-request-server"
version = "0.1.0"
description = "HTTPS server for collecting resume requests"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.9.3",
    "gunicorn>=21.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
resume-server = "server:create_app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.gunicorn]
bind = "0.0.0.0:8443"
workers = 4
worker_class = "aiohttp.worker.GunicornWebWorker"
certfile = "cert.pem"
keyfile = "key.pem"
accesslog = "-"
errorlog = "-"
loglevel = "info"
reload = true
